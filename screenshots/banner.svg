<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bfecf7"/>
      <stop offset="55%" style="stop-color:#e8d5f5"/>
      <stop offset="100%" style="stop-color:#f0c8e8"/>
    </linearGradient>
  </defs>

  <!-- Background matching site gradient -->
  <rect width="860" height="180" rx="18" fill="url(#bg)"/>

  <!-- Soft decorative blobs -->
  <circle cx="80" cy="50" r="60" fill="#a8d8ea" fill-opacity="0.25"/>
  <circle cx="780" cy="140" r="70" fill="#d4a8ea" fill-opacity="0.2"/>
  <circle cx="430" cy="160" r="40" fill="#f5c2e0" fill-opacity="0.18"/>

  <!-- Brain emoji -->
  <text x="160" y="108" font-size="52" text-anchor="middle">🧠</text>

  <!-- Main title - matching site teal color #1a7a8a ish -->
  <text x="450" y="90" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" fill="#0d6e7a" text-anchor="middle">Brainsplain</text>

  <!-- Tagline matching site subtitle -->
  <text x="450" y="132" font-family="Arial, sans-serif" font-size="19" fill="#2e8fa0" text-anchor="middle">Knowledge for everyone, explained simply.</text>

  <!-- Subtle bottom line -->
  <line x1="320" y1="152" x2="580" y2="152" stroke="#2e8fa0" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Dog mascot hint -->
  <text x="700" y="115" font-size="46" text-anchor="middle">🐶</text>
</svg>
